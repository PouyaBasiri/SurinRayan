name: Build and Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dotnet:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore SurinRayan.sln

    - name: Build Project
      run: dotnet build SurinRayan.sln --no-restore -c Release

    - name: Run Tests
      run: dotnet test SurinRayan.sln --no-build --verbosity normal

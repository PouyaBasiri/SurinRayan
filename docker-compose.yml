version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: surinrayan_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surinrayan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surinrayan_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: surinrayan_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@surinrayan.ir
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - surinrayan_network

volumes:
  postgres_data:
    driver: local

networks:
  surinrayan_network:
    driver: bridge
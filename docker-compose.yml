version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: surinrayan_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surinrayan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surinrayan_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: surinrayan_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@surinrayan.ir
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - surinrayan_network

  backend:
    build:
      context: .
      dockerfile: src/SurinRayan.Api/Dockerfile 
    container_name: surinrayan_backend
    restart: always
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=surinrayan_db;Username=postgres;Password=postgres
      - JwtSettings__SecretKey=YourSuperSecretKeyForJwtAuthentication123456!
      - JwtSettings__Issuer=SurinRayanApi
      - JwtSettings__Audience=SurinRayanClient
    depends_on:
      - postgres
    networks:
      - surinrayan_network

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: surinrayan_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - surinrayan_network

volumes:
  postgres_data:
    driver: local

networks:
  surinrayan_network:
    driver: bridge